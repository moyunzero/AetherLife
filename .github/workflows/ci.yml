name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm turbo build --filter=@aetherlife/shared --filter=@aetherlife/game-actions

      - name: Node unit tests
        run: pnpm turbo test

      - name: AI gateway tests
        run: |
          cd apps/ai-gateway
          uv sync
          uv run pytest tests -q

      - name: Agent worker tests (LLM_MOCK)
        run: |
          cd workers/agent-worker
          uv sync
          LLM_MOCK=1 uv run pytest -q
